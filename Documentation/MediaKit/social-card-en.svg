<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b47"/>
      <stop offset="1" stop-color="#23245d"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45b6f5"/>
      <stop offset="1" stop-color="#7767f8"/>
    </linearGradient>
    <clipPath id="app-frame"><rect x="730" y="194" width="770" height="513" rx="28"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#050814" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="120" cy="90" r="390" fill="#1a3e63" opacity=".62"/>
  <circle cx="650" cy="890" r="410" fill="#34337b" opacity=".72"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
    <rect x="90" y="92" width="95" height="95" rx="26" fill="url(#icon)"/>
    <g stroke="#fff" stroke-width="8" stroke-linecap="round">
      <path d="M120 128v26"/><path d="M136 116v50"/><path d="M152 106v70"/><path d="M168 124v38"/>
    </g>
    <text x="210" y="158" fill="#fff" font-size="54" font-weight="750">LocalScribe</text>
    <text x="90" y="290" fill="#fff" font-size="48" font-weight="720">Turn Mac audio</text>
    <text x="90" y="350" fill="#fff" font-size="48" font-weight="720">into editable captions</text>
    <text x="96" y="418" fill="#d6e2f3" font-size="24">Native · open source · local-first transcription for macOS</text>
    <g font-size="20" fill="#edf5ff" text-anchor="middle">
      <rect x="90" y="477" width="190" height="54" rx="27" fill="#fff" opacity=".13"/><text x="185" y="511">Mac audio captions</text>
      <rect x="296" y="477" width="190" height="54" rx="27" fill="#fff" opacity=".13"/><text x="391" y="511">Media transcription</text>
      <rect x="90" y="547" width="190" height="54" rx="27" fill="#fff" opacity=".13"/><text x="185" y="581">Local translation</text>
      <rect x="296" y="547" width="190" height="54" rx="27" fill="#fff" opacity=".13"/><text x="391" y="581">Subtitle export</text>
    </g>
    <text x="96" y="680" fill="#fff" font-size="24" font-weight="650">Apple Speech · Whisper · SenseVoice · Parakeet</text>
    <text x="96" y="736" fill="#b6c8df" font-size="22">Apple silicon · macOS 15.5+</text>
    <text x="96" y="797" fill="#62b4ff" font-size="22" font-weight="650">github.com/maddylaneeee/ShengJi</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="728" y="192" width="774" height="517" rx="30" fill="#fff" opacity=".96"/>
    <image x="730" y="194" width="770" height="513" preserveAspectRatio="xMidYMid meet" clip-path="url(#app-frame)" xlink:href="../Screenshots/home-en.png"/>
    <rect x="729" y="193" width="772" height="515" rx="29" fill="none" stroke="#a9b7c9" stroke-opacity=".6"/>
  </g>
</svg>
